<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kalends</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="display.css">
</head>
<body>
  <main id="app" class="layout-portrait" aria-live="off">
    <section id="photo" class="panel photo" hidden>
      <img id="photo-a" alt="">
      <img id="photo-b" alt="">
    </section>
    <section id="clock" class="panel clock">
      <div class="time"><span id="time">--:--</span><span id="ampm" class="ampm"></span></div>
      <div id="date" class="date"></div>
      <div id="title" class="title" hidden></div>
    </section>
    <section id="weather" class="panel weather" hidden>
      <div class="now">
        <span id="wx-icon" class="wx-icon"></span>
        <span id="wx-temp" class="wx-temp"></span>
        <div class="wx-meta">
          <div id="wx-desc" class="wx-desc"></div>
          <div id="wx-extra" class="wx-extra"></div>
        </div>
      </div>
      <ol id="forecast" class="forecast"></ol>
    </section>
    <section id="agenda" class="panel agenda"></section>
    <section id="grid" class="panel grid">
      <div id="weekdays" class="weekdays"></div>
      <div id="weeks" class="weeks"></div>
    </section>
    <div id="status" class="status" hidden></div>
  </main>
  <script src="display.js" type="module"></script>
</body>
</html>
